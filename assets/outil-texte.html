<!-- Outil texte : écrire au clavier n'importe où sur les diapos (touche T). -->
<style>
  .ot-layer {
    position: absolute;
    inset: 0;
    z-index: 25;
    pointer-events: none;
  }
  .ot-actif .ot-layer {
    pointer-events: auto;
    cursor: text;
  }
  .ot-box {
    position: absolute;
    min-width: 1.5em;
    padding: 2px 8px;
    line-height: 1.25;
    white-space: pre-wrap;
    text-align: left;
    pointer-events: auto;
    outline: none;
    border: 2px dashed transparent;
    border-radius: 6px;
    font-family: inherit;
  }
  .ot-actif .ot-box { border-color: rgba(46, 134, 193, .35); }
  .ot-box:focus-within { border-color: #2e86c1; background: rgba(255, 255, 255, .6); }
  .ot-texte { outline: none; }
  .ot-handle {
    position: absolute;
    left: -22px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 26px;
    border-radius: 4px;
    background: #2e86c1;
    color: #fff;
    font: 14px/26px sans-serif;
    text-align: center;
    cursor: move;
    display: none;
    user-select: none;
  }
  .ot-actif .ot-box:hover .ot-handle,
  .ot-box:focus-within .ot-handle { display: block; }

  .ot-bouton {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    color: #451963;
    cursor: pointer;
    user-select: none;
    padding: 0 4px;
    border-radius: 4px;
  }
  .ot-bouton.ot-seul { position: fixed; left: 12px; bottom: 8px; z-index: 30; }
  .ot-actif .ot-bouton { background: #451963; color: #fff; }

  .ot-palette {
    position: fixed;
    left: 12px;
    bottom: 46px;
    z-index: 40;
    display: none;
    gap: 6px;
    align-items: center;
    padding: 6px 8px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    font: 14px sans-serif;
  }
  .ot-actif .ot-palette { display: flex; }
  .ot-palette button {
    border: 2px solid transparent;
    border-radius: 6px;
    background: #f4f4f4;
    cursor: pointer;
    font: inherit;
    padding: 2px 8px;
    min-width: 28px;
    height: 28px;
  }
  .ot-palette button.ot-choisi { border-color: #2e86c1; }
  .ot-palette .ot-couleur { padding: 0; width: 28px; }
  .ot-palette .ot-sep { width: 1px; height: 22px; background: #ddd; }
  html.print-pdf .ot-bouton, html.print-pdf .ot-palette { display: none; }
</style>
<script>
(function () {
  var COULEURS = { noir: '#222222', rouge: '#f60303', marine: '#000149', vert: '#053E00', violet: '#451963' };
  var TAILLES = { S: 24, M: 34, L: 48 };
  var etat = { couleur: COULEURS.noir, taille: 'M', actif: false };
  var layer, slides, palette, bouton;

  function cle() {
    var i = Reveal.getIndices();
    return 'outil-texte:' + location.pathname + ':' + i.h + '-' + (i.v || 0);
  }
  function lire(k) {
    try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; }
  }
  function ecrire(k, v) {
    try {
      if (v.length) localStorage.setItem(k, JSON.stringify(v));
      else localStorage.removeItem(k);
    } catch (e) {}
  }
  function texteDe(box) {
    return box.querySelector('.ot-texte').innerText.replace(/\n$/, '');
  }

  function sauver() {
    var donnees = [];
    layer.querySelectorAll('.ot-box').forEach(function (b) {
      var t = texteDe(b);
      if (!t.trim() && document.activeElement !== b.querySelector('.ot-texte')) return;
      donnees.push({ x: parseFloat(b.style.left), y: parseFloat(b.style.top), t: t, c: b.style.color, s: parseFloat(b.style.fontSize) });
    });
    ecrire(cle(), donnees.filter(function (d) { return d.t.trim(); }));
  }

  function coord(e) {
    var r = slides.getBoundingClientRect();
    var echelle = slides.offsetWidth / r.width;
    return { x: (e.clientX - r.left) * echelle, y: (e.clientY - r.top) * echelle, echelle: echelle };
  }

  function creer(d) {
    var box = document.createElement('div');
    box.className = 'ot-box';
    box.style.left = d.x + 'px';
    box.style.top = d.y + 'px';
    box.style.color = d.c;
    box.style.fontSize = d.s + 'px';
    box.style.maxWidth = Math.max(200, slides.offsetWidth - d.x - 10) + 'px';

    var poignee = document.createElement('span');
    poignee.className = 'ot-handle';
    poignee.textContent = '⠿';
    poignee.title = 'Déplacer';

    var texte = document.createElement('div');
    texte.className = 'ot-texte';
    try { texte.contentEditable = 'plaintext-only'; } catch (e) {}
    if (texte.contentEditable !== 'plaintext-only') texte.contentEditable = 'true';
    texte.spellcheck = false;
    texte.textContent = d.t || '';

    box.appendChild(poignee);
    box.appendChild(texte);
    layer.appendChild(box);

    texte.addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Escape') { texte.blur(); basculer(false); }
    });
    texte.addEventListener('input', sauver);
    texte.addEventListener('focus', function () {
      box.style.color = box.style.color || etat.couleur;
    });
    texte.addEventListener('blur', function () {
      if (!texteDe(box).trim()) box.remove();
      sauver();
    });
    box.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

    poignee.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var depart = coord(e);
      var x0 = parseFloat(box.style.left), y0 = parseFloat(box.style.top);
      function bouger(ev) {
        var p = coord(ev);
        box.style.left = (x0 + p.x - depart.x) + 'px';
        box.style.top = (y0 + p.y - depart.y) + 'px';
      }
      function lacher() {
        document.removeEventListener('pointermove', bouger);
        document.removeEventListener('pointerup', lacher);
        sauver();
      }
      document.addEventListener('pointermove', bouger);
      document.addEventListener('pointerup', lacher);
    });
    return texte;
  }

  function afficher() {
    layer.innerHTML = '';
    lire(cle()).forEach(creer);
  }

  function basculer(force) {
    etat.actif = typeof force === 'boolean' ? force : !etat.actif;
    document.documentElement.classList.toggle('ot-actif', etat.actif);
    if (!etat.actif && document.activeElement && document.activeElement.classList.contains('ot-texte')) {
      document.activeElement.blur();
    }
  }

  function boutonPalette(contenu, titre, action, classe) {
    var b = document.createElement('button');
    b.type = 'button';
    b.title = titre;
    if (classe) b.className = classe;
    b.innerHTML = contenu;
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); });
    b.addEventListener('click', function (e) { e.stopPropagation(); action(b); });
    palette.appendChild(b);
    return b;
  }
  function marquer(groupe, b) {
    palette.querySelectorAll('.' + groupe).forEach(function (x) { x.classList.remove('ot-choisi'); });
    b.classList.add('ot-choisi');
  }
  function appliquerAuFocus(prop, valeur) {
    var t = document.activeElement;
    if (t && t.classList.contains('ot-texte')) { t.parentNode.style[prop] = valeur; sauver(); }
  }

  function construirePalette() {
    palette = document.createElement('div');
    palette.className = 'ot-palette';
    Object.keys(COULEURS).forEach(function (nom, i) {
      var b = boutonPalette('', nom, function (el) {
        etat.couleur = COULEURS[nom];
        marquer('ot-couleur', el);
        appliquerAuFocus('color', etat.couleur);
      }, 'ot-couleur' + (i === 0 ? ' ot-choisi' : ''));
      b.style.background = COULEURS[nom];
    });
    var sep = document.createElement('span'); sep.className = 'ot-sep'; palette.appendChild(sep);
    Object.keys(TAILLES).forEach(function (t) {
      boutonPalette(t, 'Taille ' + t, function (el) {
        etat.taille = t;
        marquer('ot-taille', el);
        appliquerAuFocus('fontSize', TAILLES[t] + 'px');
      }, 'ot-taille' + (t === 'M' ? ' ot-choisi' : ''));
    });
    var sep2 = document.createElement('span'); sep2.className = 'ot-sep'; palette.appendChild(sep2);
    boutonPalette('Effacer la diapo', 'Effacer les textes de cette diapo', function () {
      if (confirm('Effacer tous les textes de cette diapo ?')) { ecrire(cle(), []); afficher(); }
    });
    boutonPalette('Tout effacer', 'Effacer les textes de toute la présentation', function () {
      if (!confirm('Effacer tous les textes de toute la présentation ?')) return;
      try {
        var prefixe = 'outil-texte:' + location.pathname + ':';
        Object.keys(localStorage).forEach(function (k) { if (k.indexOf(prefixe) === 0) localStorage.removeItem(k); });
      } catch (e) {}
      afficher();
    });
    document.querySelector('.reveal').appendChild(palette);
  }

  function construireBouton() {
    bouton = document.createElement('span');
    bouton.className = 'ot-bouton';
    bouton.textContent = 'T';
    bouton.title = 'Outil texte (T)';
    bouton.addEventListener('click', function (e) { e.stopPropagation(); basculer(); });
    var zone = document.querySelector('.reveal .slide-chalkboard-buttons');
    if (zone) zone.appendChild(bouton);
    else { bouton.classList.add('ot-seul'); document.querySelector('.reveal').appendChild(bouton); }
  }

  function init() {
    slides = document.querySelector('.reveal .slides');
    layer = document.createElement('div');
    layer.className = 'ot-layer';
    slides.appendChild(layer);

    layer.addEventListener('pointerdown', function (e) {
      if (!etat.actif || e.target !== layer) return;
      e.preventDefault();
      e.stopPropagation();
      var p = coord(e);
      var texte = creer({ x: p.x, y: p.y - TAILLES[etat.taille] * 0.7, t: '', c: etat.couleur, s: TAILLES[etat.taille] });
      setTimeout(function () { texte.focus(); }, 0);
    });
    layer.addEventListener('touchstart', function (e) { if (etat.actif) e.stopPropagation(); }, { passive: true });

    construireBouton();
    construirePalette();
    Reveal.addKeyBinding({ keyCode: 84, key: 'T', description: 'Outil texte : écrire au clavier' }, function () { basculer(); });
    Reveal.on('slidechanged', afficher);
    Reveal.on('overviewshown', function () { layer.style.display = 'none'; });
    Reveal.on('overviewhidden', function () { layer.style.display = ''; afficher(); });
    afficher();
  }

  function demarrer() {
    if (window.Reveal && Reveal.isReady && Reveal.isReady()) init();
    else if (window.Reveal && Reveal.on) Reveal.on('ready', init);
    else setTimeout(demarrer, 100);
  }
  demarrer();
})();
</script>
