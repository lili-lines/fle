<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420">
  <defs>
    <radialGradient id="lumiere" cx=".5" cy=".6" r=".6">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".6" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#b9770e"/>
    </radialGradient>
  </defs>
  <rect width="420" height="420" fill="#2c1e12"/>
  <!-- Mur de pierres -->
  <g fill="#3d2b1c" stroke="#24180d" stroke-width="3">
    <rect x="0" y="0" width="90" height="50"/><rect x="90" y="0" width="120" height="50"/><rect x="210" y="0" width="110" height="50"/><rect x="320" y="0" width="100" height="50"/>
    <rect x="0" y="50" width="60" height="50"/><rect x="320" y="50" width="100" height="50"/>
    <rect x="0" y="100" width="100" height="50"/><rect x="330" y="100" width="90" height="50"/>
    <rect x="0" y="150" width="70" height="50"/><rect x="320" y="150" width="100" height="50"/>
    <rect x="0" y="200" width="100" height="50"/><rect x="330" y="200" width="90" height="50"/>
    <rect x="0" y="250" width="80" height="50"/><rect x="320" y="250" width="100" height="50"/>
  </g>
  <!-- Ouverture lumineuse -->
  <path d="M110 330 V130 a100 100 0 0 1 200 0 V330 Z" fill="url(#lumiere)"/>
  <!-- Porte entrouverte -->
  <path d="M110 330 V130 a100 100 0 0 1 60 -88 L190 70 V355 Z" fill="#7a4e2d" stroke="#4a2e14" stroke-width="4"/>
  <path d="M135 120 V330 M160 90 V340" stroke="#5d3a1a" stroke-width="3"/>
  <circle cx="175" cy="220" r="7" fill="#d4ac0d"/>
