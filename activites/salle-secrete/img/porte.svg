    <path d="M420 0 L340 0 M420 0 L420 80 M420 0 L355 55 M420 0 L385 70 M420 0 L345 30"/>
    <path d="M395 0 q5 15 25 20 M370 0 q8 30 50 45 M350 0 q10 45 70 65"/>
  </g>
  <!-- Point d'interrogation dans la lumière -->
  <text x="250" y="250" font-family="Georgia, serif" font-size="110" font-weight="700" fill="#b9770e" opacity=".55" text-anchor="middle">?</text>
