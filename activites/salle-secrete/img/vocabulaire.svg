    <path d="M0 40 l-30 -25 M0 30 l28 -22" stroke="#6e4b2a" stroke-width="8"/>
    <circle cx="0" cy="-30" r="58" fill="#b9770e"/>
    <circle cx="-40" cy="-5" r="35" fill="#ca6f1e"/>
    <circle cx="40" cy="-8" r="36" fill="#d68910"/>
