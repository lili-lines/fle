    <circle cx="38" cy="38" r="20" fill="#2b2d42"/><text x="38" y="46">1</text>
    <circle cx="278" cy="38" r="20" fill="#2b2d42"/><text x="278" y="46">2</text>
    <circle cx="518" cy="38" r="20" fill="#2b2d42"/><text x="518" y="46">3</text>
    <circle cx="758" cy="38" r="20" fill="#2b2d42"/><text x="758" y="46">4</text>
    <circle cx="38" cy="288" r="20" fill="#2b2d42"/><text x="38" y="296">5</text>
    <circle cx="278" cy="288" r="20" fill="#2b2d42"/><text x="278" y="296">6</text>
    <circle cx="518" cy="288" r="20" fill="#2b2d42"/><text x="518" y="296">7</text>
    <circle cx="758" cy="288" r="20" fill="#2b2d42"/><text x="758" y="296">8</text>
