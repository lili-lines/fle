<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420">
  <rect width="320" height="420" fill="#efe4d0"/>
  <!-- Cadre photo ancienne -->
  <rect x="20" y="20" width="280" height="380" fill="#e6d3ae" stroke="#8a6d45" stroke-width="8"/>

  <!-- Tresses -->
  <path d="M105 150 q-20 60 -5 120" stroke="#6b3e1d" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M215 150 q20 60 5 120" stroke="#6b3e1d" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="272" r="9" fill="#c0392b"/>
  <circle cx="220" cy="272" r="9" fill="#c0392b"/>

  <!-- Blouse d'écolière -->
  <path d="M70 400 Q80 285 160 270 Q240 285 250 400 Z" fill="#3a6ea5"/>
  <path d="M125 278 L160 315 L195 278 L180 268 L160 290 L140 268 Z" fill="#ffffff"/>
  <circle cx="160" cy="340" r="4" fill="#24496f"/>
  <circle cx="160" cy="365" r="4" fill="#24496f"/>

  <!-- Cou et visage -->
  <rect x="148" y="240" width="24" height="35" fill="#f2c9a0"/>
  <ellipse cx="160" cy="185" rx="58" ry="66" fill="#f5d3b0"/>

  <!-- Cheveux -->
  <path d="M100 180 Q100 110 160 108 Q220 110 220 180 Q210 140 160 138 Q110 140 100 180 Z" fill="#6b3e1d"/>
  <path d="M160 108 V140" stroke="#5a3418" stroke-width="3"/>

  <!-- Visage -->
  <circle cx="138" cy="185" r="6" fill="#3b2a1a"/>
  <circle cx="182" cy="185" r="6" fill="#3b2a1a"/>
  <path d="M128 170 q10 -6 20 0 M172 170 q10 -6 20 0" stroke="#5a3418" stroke-width="3" fill="none"/>
  <path d="M145 218 q15 12 30 0" stroke="#a0442b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="125" cy="205" r="9" fill="#f1948a" opacity=".5"/>
  <circle cx="195" cy="205" r="9" fill="#f1948a" opacity=".5"/>

  <!-- Carnet tenu -->
  <rect x="190" y="320" width="62" height="78" fill="#8e5a2b" stroke="#5d3a1a" stroke-width="3" transform="rotate(-8 221 359)"/>
  <rect x="200" y="335" width="40" height="8" fill="#e6d3ae" transform="rotate(-8 221 359)"/>

  <text x="160" y="58" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#5a4630">Marguerite, 1954</text>
</svg>
