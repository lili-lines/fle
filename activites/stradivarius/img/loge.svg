<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="400" fill="#3f2b4a"/>
  <rect y="320" width="640" height="80" fill="#6b4a35"/>
  <path d="M0 320 h640" stroke="#4a3122" stroke-width="4"/>

  <!-- Miroir avec ampoules -->
  <rect x="50" y="35" width="240" height="160" fill="#2a2030" rx="6"/>
  <rect x="70" y="55" width="200" height="120" fill="#9fb4c7"/>
  <path d="M90 70 l50 -10 M90 90 l90 -20" stroke="#ffffff" stroke-width="6" opacity=".5" stroke-linecap="round"/>
  <g fill="#ffe08a">
    <circle cx="70" cy="45" r="8"/><circle cx="110" cy="45" r="8"/><circle cx="150" cy="45" r="8"/><circle cx="190" cy="45" r="8"/><circle cx="230" cy="45" r="8"/><circle cx="270" cy="45" r="8"/>
    <circle cx="60" cy="85" r="8"/><circle cx="60" cy="125" r="8"/><circle cx="60" cy="165" r="8"/>
    <circle cx="280" cy="85" r="8"/><circle cx="280" cy="125" r="8"/><circle cx="280" cy="165" r="8"/>
  </g>

  <!-- Coiffeuse -->
  <rect x="35" y="205" width="270" height="18" fill="#8e5a2b"/>
  <rect x="45" y="223" width="14" height="97" fill="#6e4520"/>
  <rect x="281" y="223" width="14" height="97" fill="#6e4520"/>
  <rect x="90" y="186" width="18" height="19" fill="#c0392b" rx="3"/>
  <rect x="230" y="180" width="40" height="25" fill="#f5f0e1" stroke="#999"/>
  <path d="M235 188 h30 M235 194 h30 M235 200 h30" stroke="#666" stroke-width="1"/>

  <!-- Étui de violon ouvert et vide -->
  <g>
    <path d="M360 300 Q350 200 380 110 Q420 70 470 110 Q500 200 490 300 Z" fill="#1f1f1f"/>
    <path d="M372 292 Q364 205 390 122 Q422 92 460 122 Q484 205 478 292 Z" fill="#1f4e79"/>
    <g fill="#163a5c">
      <ellipse cx="425" cy="250" rx="34" ry="30"/>
      <ellipse cx="425" cy="195" rx="27" ry="24"/>
      <rect x="402" y="200" width="46" height="45"/>
      <rect x="419" y="120" width="12" height="75"/>
      <circle cx="425" cy="115" r="9"/>
    </g>
    <path d="M500 300 L560 310 L548 120 L490 110" fill="#2a2a2a" stroke="#111" stroke-width="2"/>
  </g>
  <text x="425" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#ffd166">vide !</text>

  <!-- Porte entrouverte -->
  <rect x="585" y="60" width="55" height="260" fill="#f7d774" opacity=".6"/>
  <path d="M585 60 L620 75 L620 330 L585 320 Z" fill="#7a4e2d" stroke="#4a2e14" stroke-width="3"/>

  <!-- Partition tombée -->
  <g transform="translate(150,355) rotate(-12)">
    <rect x="-55" y="-22" width="110" height="44" fill="#f5f0e1" stroke="#999"/>
    <path d="M-48 -12 h96 M-48 -6 h96 M-48 0 h96 M-48 6 h96 M-48 12 h96" stroke="#555" stroke-width="1"/>
    <circle cx="-25" cy="-3" r="3" fill="#222"/><circle cx="0" cy="3" r="3" fill="#222"/><circle cx="25" cy="-6" r="3" fill="#222"/>
  </g>
</svg>
