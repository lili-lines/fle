<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#fbf6ee"/>

  <!-- Scène -->
  <rect x="20" y="20" width="860" height="80" fill="#7b2d3a" stroke="#333" stroke-width="3"/>
  <text x="450" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">la scène</text>

  <!-- Couloir des coulisses -->
  <rect x="20" y="100" width="860" height="50" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
  <text x="430" y="131" text-anchor="middle" font-size="16" font-style="italic" fill="#666">couloir des coulisses</text>

  <!-- Salle de répétition -->
  <rect x="20" y="150" width="260" height="170" fill="#e8daf2" stroke="#333" stroke-width="3"/>
  <text x="150" y="225" text-anchor="middle" font-size="19" font-weight="600" fill="#4a2a63">la salle de répétition</text>
  <g transform="translate(115,245)">
    <rect width="70" height="34" fill="#222" rx="3"/><rect x="4" y="18" width="62" height="14" fill="#fff"/>
    <path d="M12 18 v14 M20 18 v14 M28 18 v14 M36 18 v14 M44 18 v14 M52 18 v14 M60 18 v14" stroke="#222"/>
  </g>
  <rect x="200" y="146" width="40" height="8" fill="#fbf6ee"/>

  <!-- Loge de l'orchestre -->
  <rect x="280" y="150" width="260" height="170" fill="#f6e3c6" stroke="#333" stroke-width="3"/>
  <text x="410" y="230" text-anchor="middle" font-size="19" font-weight="600" fill="#5a3e1b">la loge de l'orchestre</text>
  <rect x="440" y="146" width="40" height="8" fill="#fbf6ee"/>

  <!-- Hall -->
  <rect x="20" y="340" width="520" height="140" fill="#fdf2c4" stroke="#333" stroke-width="3"/>
  <text x="280" y="405" text-anchor="middle" font-size="19" font-weight="600" fill="#6b5a10">le hall et le bar</text>
  <text x="280" y="430" text-anchor="middle" font-size="15" fill="#6b5a10">(ouvert au public)</text>

  <!-- Couloir B -->
  <rect x="560" y="150" width="80" height="330" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#333" transform="rotate(-90 600 330)">couloir B</text>

  <!-- Loges du couloir B -->
  <rect x="640" y="150" width="240" height="165" fill="#fde2e4" stroke="#333" stroke-width="3"/>
  <text x="760" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#7a2531">la loge de</text>
  <text x="760" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#7a2531">Léon Varga</text>
  <path d="M760 258 l7 14 l15 2 l-11 10 l3 15 l-14 -7 l-14 7 l3 -15 l-11 -10 l15 -2 z" fill="#f4c542"/>
  <rect x="636" y="200" width="8" height="40" fill="#fbf6ee"/>

  <rect x="640" y="315" width="240" height="165" fill="#d5f0e3" stroke="#333" stroke-width="3"/>
  <text x="760" y="390" text-anchor="middle" font-size="19" font-weight="600" fill="#1d5c40">la loge de</text>
  <text x="760" y="415" text-anchor="middle" font-size="19" font-weight="600" fill="#1d5c40">la cheffe</text>
  <rect x="636" y="370" width="8" height="40" fill="#fbf6ee"/>

  <!-- Entrée du couloir B et lecteurs de badge -->
  <rect x="575" y="146" width="50" height="8" fill="#fbf6ee"/>
  <g>
    <rect x="628" y="158" width="26" height="34" rx="4" fill="#2e86c1" stroke="#1b4f72" stroke-width="2"/>
    <rect x="633" y="164" width="16" height="10" fill="#d6eaf8"/>
    <circle cx="641" cy="183" r="3" fill="#2ecc71"/>
  </g>
  <g>
    <rect x="246" y="158" width="26" height="34" rx="4" fill="#2e86c1" stroke="#1b4f72" stroke-width="2"/>
    <rect x="251" y="164" width="16" height="10" fill="#d6eaf8"/>
    <circle cx="259" cy="183" r="3" fill="#2ecc71"/>
  </g>
  <g font-size="14" fill="#1b4f72" font-weight="600">
    <text x="660" y="140">lecteur de badge</text>
    <text x="120" y="140">lecteur de badge</text>
  </g>
  <path d="M655 136 l-12 18" stroke="#1b4f72" stroke-width="2"/>
  <path d="M245 136 l12 18" stroke="#1b4f72" stroke-width="2"/>

  <!-- Seau de Lucie au fond du couloir B -->
  <g transform="translate(600,455)">
    <path d="M-14 -6 L14 -6 L10 16 L-10 16 Z" fill="#7f8c8d"/>
    <path d="M6 -6 L18 -45" stroke="#8e5a2b" stroke-width="3"/>
  </g>
</svg>
