<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="570" fill="#eef3e2"/>

  <!-- Rues -->
  <g fill="#c9c9cf">
    <rect x="0" y="250" width="900" height="40"/>
    <rect x="430" y="120" width="40" height="320"/>
    <rect x="140" y="200" width="30" height="50"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="14 10">
    <path d="M0 270 H900"/><path d="M450 125 V430"/>
  </g>
  <text x="640" y="286" font-size="14" font-style="italic" fill="#555">avenue du Parc</text>
  <text x="458" y="380" font-size="15" font-style="italic" fill="#555" transform="rotate(-90 458 380)">rue des Lanternes</text>
  <text x="178" y="230" font-size="13" font-style="italic" fill="#555">chemin des Champs</text>

  <!-- Ferme -->
  <rect x="20" y="20" width="250" height="180" fill="#e9d8a6" stroke="#8a7a5c" stroke-width="2"/>
  <g stroke="#b9975b" stroke-width="4"><path d="M35 120 H150 M35 140 H150 M35 160 H150 M35 180 H150"/></g>
  <g fill="#e67e22"><circle cx="50" cy="120" r="7"/><circle cx="95" cy="140" r="7"/><circle cx="130" cy="160" r="7"/><circle cx="70" cy="180" r="7"/></g>
  <path d="M170 110 L215 70 L260 110 V190 H170 Z" fill="#c0392b" stroke="#7b241c" stroke-width="2"/>
  <rect x="200" y="140" width="30" height="50" fill="#7b241c"/>
  <text x="95" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#5a3e1b">la ferme</text>
  <text x="95" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#5a3e1b">Potiron</text>

  <!-- Hôpital des enfants -->
  <rect x="340" y="20" width="220" height="100" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <rect x="438" y="38" width="24" height="8" fill="#f60303"/><rect x="446" y="30" width="8" height="24" fill="#f60303"/>
  <text x="450" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#000149">l'hôpital</text>
  <text x="450" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#000149">des enfants</text>

  <!-- Pharmacie (fenêtre de Rose) -->
  <rect x="290" y="140" width="130" height="100" fill="#d5f0e3" stroke="#333" stroke-width="2"/>
  <rect x="345" y="152" width="20" height="6" fill="#1e8449"/><rect x="352" y="145" width="6" height="20" fill="#1e8449"/>
  <text x="355" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1d5c40">la pharmacie</text>
  <rect x="400" y="200" width="20" height="24" fill="#f7d774" stroke="#333" stroke-width="2"/>
  <text x="355" y="222" text-anchor="middle" font-size="13" fill="#1d5c40">(fenêtre de Rose)</text>

  <!-- École, fleuriste, serres -->
  <rect x="480" y="140" width="120" height="100" fill="#fde2e4" stroke="#333" stroke-width="2"/>
  <text x="540" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#7a2531">l'école</text>
  <rect x="610" y="140" width="120" height="100" fill="#f9e79f" stroke="#333" stroke-width="2"/>
  <text x="670" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#7d6608">la fleuriste</text>
  <rect x="740" y="140" width="145" height="100" fill="#d6eaf8" stroke="#333" stroke-width="2"/>
  <g stroke="#85c1e9" stroke-width="2"><path d="M760 150 L780 140 L800 150 M800 150 L820 140 L840 150 M840 150 L860 140 L880 150"/></g>
  <text x="812" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4f72">les serres</text>
  <text x="812" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4f72">de la ville</text>

  <!-- Parc -->
  <rect x="20" y="300" width="390" height="150" fill="#a9dfbf" stroke="#1e8449" stroke-width="2"/>
  <g fill="#27ae60"><circle cx="60" cy="340" r="20"/><circle cx="110" cy="400" r="22"/><circle cx="350" cy="340" r="20"/><circle cx="320" cy="410" r="18"/><circle cx="60" cy="420" r="16"/></g>
  <path d="M150 320 Q220 360 160 430 M160 430" stroke="#e9d8a6" stroke-width="10" fill="none"/>
  <text x="240" y="375" text-anchor="middle" font-size="18" font-weight="700" fill="#145a32">le parc</text>
  <text x="240" y="398" text-anchor="middle" font-size="15" fill="#145a32">(le défilé)</text>

  <!-- Boulangerie, pizzeria -->
  <rect x="560" y="300" width="150" height="110" fill="#fadbd8" stroke="#333" stroke-width="2"/>
  <text x="635" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#7b241c">la boulangerie</text>
  <rect x="725" y="300" width="160" height="110" fill="#fdebd0" stroke="#333" stroke-width="2"/>
  <text x="805" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#7e5109">la pizzeria</text>

  <!-- Place et mairie -->
  <rect x="380" y="440" width="140" height="50" fill="#d5d8dc" stroke="#333" stroke-width="2"/>
  <text x="450" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#333">la place</text>
  <rect x="360" y="490" width="180" height="65" fill="#c9b79c" stroke="#333" stroke-width="3"/>
  <text x="450" y="530" text-anchor="middle" font-size="18" font-weight="700" fill="#5a3e1b">la mairie</text>
  <circle cx="450" cy="455" r="8" fill="#f39c12"/>

  <!-- Rose des vents -->
  <g transform="translate(830,500)">
    <circle r="34" fill="#ffffff" stroke="#000149" stroke-width="2"/>
    <path d="M0 -28 L8 0 L0 28 L-8 0 Z" fill="#000149"/>
    <path d="M0 -28 L8 0 L-8 0 Z" fill="#f60303"/>
    <text y="-38" text-anchor="middle" font-size="16" font-weight="800" fill="#f60303">N</text>
  </g>
</svg>
