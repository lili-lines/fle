<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="400" fill="#1b1f3b"/>
  <circle cx="560" cy="55" r="26" fill="#f7e9b0"/>
  <g fill="#f7e9b0"><circle cx="40" cy="30" r="1.5"/><circle cx="130" cy="20" r="2"/><circle cx="470" cy="35" r="1.5"/><circle cx="610" cy="120" r="1.5"/></g>

  <!-- Chauves-souris -->
  <g fill="#0d0f20">
    <path d="M460 70 q8 -8 16 0 q4 -6 8 0 q4 -6 8 0 q8 -8 16 0 q-10 2 -16 10 q-4 -4 -8 0 q-4 -4 -8 0 q-6 -8 -16 -10 z"/>
    <path d="M80 80 q6 -6 12 0 q3 -5 6 0 q3 -5 6 0 q6 -6 12 0 q-8 2 -12 8 q-3 -3 -6 0 q-3 -3 -6 0 q-4 -6 -12 -8 z"/>
  </g>

  <!-- La mairie -->
  <rect x="170" y="90" width="300" height="170" fill="#c9b79c"/>
  <path d="M160 92 L320 40 L480 92 Z" fill="#a8977b"/>
  <circle cx="320" cy="72" r="16" fill="#f5f0e1" stroke="#5a4630" stroke-width="3"/>
  <path d="M320 72 V62 M320 72 L328 76" stroke="#5a4630" stroke-width="2.5"/>
  <rect x="290" y="105" width="60" height="18" fill="#5a4630"/>
  <text x="320" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#f5f0e1">MAIRIE</text>
  <g fill="#3b4a6b">
    <rect x="195" y="135" width="40" height="50" rx="20"/><rect x="255" y="135" width="40" height="50" rx="20"/>
    <rect x="345" y="135" width="40" height="50" rx="20"/><rect x="405" y="135" width="40" height="50" rx="20"/>
  </g>
  <rect x="300" y="200" width="40" height="60" fill="#5a3e1b"/>
  <path d="M440 40 V92" stroke="#555" stroke-width="3"/>
  <path d="M440 42 h30 v18 h-30 z" fill="#2e86c1"/>

  <!-- Guirlande de lanternes -->
  <path d="M0 60 Q160 120 320 95 Q480 120 640 70" stroke="#333" stroke-width="2" fill="none"/>
  <g fill="#f39c12">
    <circle cx="40" cy="75" r="9"/><circle cx="110" cy="96" r="9"/><circle cx="190" cy="106" r="9"/>
    <circle cx="450" cy="106" r="9"/><circle cx="530" cy="98" r="9"/><circle cx="600" cy="80" r="9"/>
  </g>

  <!-- Sol de la place -->
  <rect y="260" width="640" height="140" fill="#4b4f6b"/>

  <!-- Socle vide -->
  <rect x="250" y="265" width="140" height="40" fill="#8a8fa8" stroke="#5c6078" stroke-width="3"/>
  <rect x="235" y="300" width="170" height="16" fill="#6e7391"/>
  <rect x="270" y="272" width="100" height="24" rx="3" fill="#f5f0e1"/>
  <text x="320" y="289" text-anchor="middle" font-size="13" font-weight="800" fill="#5a3e1b">GASTON 250 kg</text>
  <!-- Graines tombées -->
  <g fill="#f5e6c4">
    <ellipse cx="300" cy="262" rx="4" ry="2.5"/><ellipse cx="335" cy="261" rx="4" ry="2.5" transform="rotate(30 335 261)"/>
    <ellipse cx="360" cy="263" rx="4" ry="2.5"/><ellipse cx="420" cy="330" rx="4" ry="2.5"/><ellipse cx="200" cy="340" rx="4" ry="2.5"/>
  </g>
  <text x="320" y="250" text-anchor="middle" font-size="44" font-weight="800" fill="#f39c12">?</text>

  <!-- Traces de pneus -->
  <g stroke="#2b2e45" stroke-width="7" stroke-dasharray="10 7" fill="none">
    <path d="M400 330 Q500 340 640 300"/>
    <path d="M400 360 Q510 372 640 332"/>
