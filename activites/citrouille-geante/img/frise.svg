<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="300" fill="#fbf6ee"/>
  <!-- Période du défilé -->
  <rect x="340" y="120" width="300" height="60" fill="#fff0c2" stroke="#FFAC00" stroke-width="2" rx="6"/>
  <text x="490" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#b36b00">le défilé : la place est vide</text>

  <!-- Flèche du temps -->
  <path d="M40 150 H950" stroke="#000149" stroke-width="5"/>
  <path d="M950 138 L975 150 L950 162 Z" fill="#000149"/>
  <g stroke="#000149" stroke-width="3">
    <path d="M90 138 v24 M215 138 v24 M340 138 v24 M490 138 v24 M640 138 v24 M790 138 v24"/>
  </g>
  <g font-size="18" font-weight="800" fill="#000149" text-anchor="middle">
    <text x="90" y="128">19 h</text><text x="215" y="128">19 h 30</text><text x="340" y="112">20 h</text>
    <text x="490" y="112">20 h 30</text><text x="640" y="112">21 h</text><text x="790" y="128">21 h 30</text>
  </g>

  <!-- Événements -->
  <g font-size="15" fill="#2b2d42" text-anchor="middle">
    <text x="90" y="235">La fête</text><text x="90" y="255">commence</text>
    <text x="215" y="235">Photos</text><text x="215" y="255">avec Gaston</text>
    <text x="340" y="235">Départ</text><text x="340" y="255">du défilé</text>
    <text x="640" y="235">Retour :</text><text x="640" y="255">Gaston a disparu !</text>
    <text x="790" y="235">La police</text><text x="790" y="255">arrive</text>
  </g>
  <g stroke="#9aa0b8" stroke-width="2" stroke-dasharray="4 4">
    <path d="M90 162 V218 M215 162 V218 M340 182 V218 M640 182 V218 M790 162 V218"/>
  </g>

  <!-- Petites icônes -->
  <g transform="translate(90,60)"><circle r="18" fill="#f39c12"/><path d="M-6 -4 l4 -4 l4 4 z M4 -4 l4 -4 l4 4 z" fill="#3b1f0a" transform="translate(-3,0)"/><path d="M-8 6 q8 7 16 0" stroke="#3b1f0a" stroke-width="2.5" fill="none"/></g>
  <g transform="translate(215,60)"><rect x="-18" y="-12" width="36" height="26" rx="5" fill="#5d6d7e"/><circle r="8" fill="#d6eaf8"/><rect x="-6" y="-17" width="12" height="6" fill="#5d6d7e"/></g>
  <g transform="translate(490,60)"><circle r="22" fill="#000149"/><text y="10" text-anchor="middle" font-size="30" font-weight="800" fill="#FFAC00">?</text></g>
  <g transform="translate(640,60)"><ellipse cx="0" cy="8" rx="22" ry="7" fill="#8a8fa8"/><text y="2" text-anchor="middle" font-size="22" font-weight="800" fill="#f60303">!</text></g>
  <g transform="translate(790,60)"><rect x="-20" y="-8" width="40" height="18" rx="4" fill="#1f5fa8"/><rect x="-10" y="-16" width="20" height="9" rx="3" fill="#1f5fa8"/><rect x="-6" y="-21" width="12" height="5" fill="#f60303"/><circle cx="-11" cy="12" r="5" fill="#222"/><circle cx="11" cy="12" r="5" fill="#222"/></g>
</svg>
